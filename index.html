<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fretboard Graph</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    body { position: relative; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #444; }
    #fretboard {
      display: block;
      touch-action: none;
    }
    #controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      z-index: 1;
    }
    #controls button, #controls select {
      padding: 6px 12px;
    }
    #stringFilters {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    .string-filter-item {
      position: absolute;
      display: flex;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }
    .string-filter-item input {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="shiftLeftBtn">&lt;</button>
    <button id="shiftRightBtn">&gt;</button>
    <select id="progressionSelect"></select>
    <span id="pathControls">
      <button id="pathPrevBtn">&#9664;</button>
      <span id="pathLabel">Path 1 of 0</span>
      <button id="pathNextBtn">&#9654;</button>
    </span>
    <button id="playBtn">Play</button>
    <button id="handedBtn">Handed: Right</button>
    <button id="flipVerticalBtn">Flip V</button>
  </div>
  <canvas id="fretboard"></canvas>
  <div id="stringFilters" aria-label="String path filters"></div>
  <script src="data/chordProgressions.js"></script>
  <script src="FretboardCanvas.js"></script>
  <script src="App.js"></script>
  <script src="index.js"></script>
</body>
</html>
