<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fretboard Graph</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; min-height: 100vh; background: #444; }
    #fretboard {
      display: block;
      margin: 0 auto;
      touch-action: none;
    }
    #controls {
      position: relative;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 8px 6px;
      z-index: 3;
    }
    #controls button, #controls select {
      padding: 4px 8px;
      min-height: 32px;
      font-size: 14px;
      line-height: 1;
      max-width: calc(100vw - 16px);
    }
    #pathControls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    #pathLabel {
      color: #fff;
      font: 13px sans-serif;
      min-width: 80px;
      text-align: center;
    }
    @media (max-width: 540px) {
      #controls {
        gap: 4px;
        padding: 6px 6px 4px;
      }
      #controls button, #controls select {
        min-height: 30px;
        padding: 3px 7px;
        font-size: 13px;
      }
      #pathLabel {
        display: none;
      }
    }
    #stringFilters {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    .string-filter-item {
      position: absolute;
      display: flex;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }
    .string-filter-item input {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="shiftLeftBtn">&lt;</button>
    <button id="shiftRightBtn">&gt;</button>
    <select id="progressionSelect"></select>
    <span id="pathControls">
      <button id="pathPrevBtn">&#9664;</button>
      <span id="pathLabel">Path 1 of 0</span>
      <button id="pathNextBtn">&#9654;</button>
    </span>
    <button id="playBtn">Play</button>
    <button id="handedBtn">Handed: Right</button>
    <button id="flipVerticalBtn">Flip V</button>
  </div>
  <canvas id="fretboard"></canvas>
  <div id="stringFilters" aria-label="String path filters"></div>
  <script src="data/chordProgressions.js"></script>
  <script src="FretboardCanvas.js"></script>
  <script src="App.js"></script>
  <script src="index.js"></script>
</body>
</html>
